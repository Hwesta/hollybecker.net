[model]
name = Craft project
label = {{ this.title }}
hidden = yes

[fields.title]
label = Title
type = html
size = large

[fields.completion_date]
label = Completion date
type = date
width = 1/4

[fields.craft_type]
label = Craft type
type = select
choices = basketweaving,pottery,sewing
choice_labels = Basketweaving, Pottery, Sewing
width = 1/4

[fields.pattern]
label = pattern
type = string
width = 1/2

[fields.summary]
label = Summary for meta

[fields.body]
label = Body
type = markdown

[fields.private_notes]
label = Private Notes
type = markdown

[attachments]
model = attachment-image